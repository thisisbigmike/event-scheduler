# Let the project's .htaccess files work, and keep private files off the web
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
</Directory>
<FilesMatch "^(config\.php|config\.sample\.php|README\.md|\.gitignore|\.dockerignore|Dockerfile|render\.yaml|cron_reminders\.php)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/(docker|apache|database|includes|\.git)">
    Require all denied
</DirectoryMatch>

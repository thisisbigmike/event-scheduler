# Let the project's .htaccess files block includes/, database/ and scripts in uploads/
<Directory /var/www/html/event-scheduler>
    AllowOverride All
    Options -Indexes
</Directory>
<FilesMatch "^(config\.php|config\.sample\.php|README\.md|\.gitignore|cron_reminders\.php)$">
    Require all denied
</FilesMatch>
